name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    strategy:
      matrix:
        command: [checkblack, checkruff, mypy, pyright, checkprettier]
    uses: lnbits/lnbits/.github/workflows/make.yml@dev
    with:
      make: ${{ matrix.command }}
      python-version: '3.12'
      npm: ${{ matrix.command == 'pyright' || matrix.command == 'checkprettier' }}

  poetry:
    uses: lnbits/lnbits/.github/workflows/poetry.yml@dev

  payments:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --check server.mjs
      - run: node payments.test.mjs
      - run: node incoming.test.mjs
      - run: node server.test.mjs
